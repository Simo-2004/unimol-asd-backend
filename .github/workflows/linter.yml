name: Code Quality Check

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # 1 Lint with Flake8
  lint:
    name: Flake8 Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Passa sempre solo per scopi dimostrativi, rimuovere "|| true" in produzione
      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  # 2 Code Formatting Check
  format:
    name: Black Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Black
        run: pip install black

      # Passa sempre solo per scopi dimostrativi, rimuovere "|| true" in produzione
      - name: Run Black Check
        run: black --check . || true

  # 3 Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      # Passa sempre solo per scopi dimostrativi, rimuovere "|| true" in produzione
      - name: Run Bandit Security Check
        run: bandit -r . -ll || true

      # Passa sempre solo per scopi dimostrativi, rimuovere "|| true" in produzione
      - name: Run Safety Dependency Check
        run: |
          pip install -r requirements.txt
          safety check || true

  # 4 Import Sorting Check
  isort:
    name: Import Sorting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install isort
        run: pip install isort

      # Passa sempre solo per scopi dimostrativi, rimuovere "|| true" in produzione
      - name: Run isort Check
        run: isort --check-only --diff . || true
